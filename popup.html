<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UXRay</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="popup-container" role="dialog" aria-label="UXRay assistant">
    <!-- Header -->
    <header class="popup-header">
      <img src="images/icon1.png" alt="UXRay Icon" class="icon logo avatar" />
      <img src="images/graphic.png" alt="company logo" id="uxray-title" class="title" />
      <button id="settingsBtn" class="icon" aria-label="Settings">
        <img src="images/gear.png" alt="settings icon (gear)" class="icon settings" />
      </button>
    </header>

    <!-- Chat / result Window -->
    <main class="chat-container" id="chatContainer" role="region" aria-live="polite">
      <!-- Messages will be injected here by JS -->
    </main>

    <!-- Input Area -->
    <form class="input-bar" id="inputBar" action="#" onsubmit="return false;">
      <!-- <img src="images/icon2.png" alt="" class="icon" aria-hidden="true" /> -->
      <input type="text" placeholder="Search (e.g. portal, login, contact...)" id="searchInput" aria-label="Search page"
        autocomplete="off" />
      <button id="sendBtn" aria-label="Send query" title="Search">
        <img src="images/search.png" alt="" class="icon" aria-hidden="true" />
      </button>
    </form>
  </div>

  <script src="scripts/popup.js"></script>
</body>

</html>
